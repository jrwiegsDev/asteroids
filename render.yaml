# Render Blueprint for the browser build of the game.
# pygbag compiles the game to WebAssembly; the output in build/web is plain static files.
services:
  - type: web
    runtime: static
    name: asteroids
    repo: https://github.com/jrwiegsDev/asteroids
    branch: main
    # --title sets the page title; otherwise pygbag uses the build folder's name,
    # which is "src" on Render.
    buildCommand: pip install pygbag==0.9.3 && python -m pygbag --title Asteroids --build .
    staticPublishPath: ./build/web
    # Deploy only after the GitHub Actions CI check (.github/workflows/ci.yml) passes
    autoDeployTrigger: checksPass
